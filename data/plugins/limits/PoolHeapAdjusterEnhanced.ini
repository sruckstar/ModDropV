[PoolHeapAdjuster]

# The memory budget in MB for the game's pools (the PoolSize limits of gameconfig.xml), up to 4095.
# The game itself: 136, of which it uses about 120. Nothing is taken until pools need it.
PoolHeapSize = 512

[RadioStations]

# How many radio stations the game can hold, up to 255 (as in GTA V Legacy). The game itself: 96, of which it uses 95,
# so any mod that adds stations needs this.
MaxRadioStations = 255
